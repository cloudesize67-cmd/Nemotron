[project]
name = "bmv-evolve"
version = "0.1.0"
description = "AlphaEvolve/FunSearch-style evolutionary coding pipeline for the Bose-Marletto-Vedral quantum-gravity protocol, using Nemotron as the LLM actor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmv_evolve"]
